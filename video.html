<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Vídeo — Convite Aurora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .iniciar {
      position: absolute;
      inset: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .aviso {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #9d744a;
      font-family: Georgia, serif;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .aviso.oculto {
      opacity: 0;
    }
  </style>
</head>

<body>
  <main class="pagina">

    <video
      id="videoAurora"
      playsinline
      preload="auto"
    >
      <source
        src="assets/Para você.mp4"
        type="video/mp4"
      >
    </video>

    <button
      id="iniciarVideo"
      class="iniciar"
      type="button"
      aria-label="Reproduzir vídeo"
    ></button>

    <div id="aviso" class="aviso">
      Toque para assistir
    </div>

  </main>

  <script>
    const video = document.getElementById("videoAurora");
    const iniciarVideo = document.getElementById("iniciarVideo");
    const aviso = document.getElementById("aviso");

    let iniciado = false;

    async function reproduzirVideo() {
      if (iniciado) return;

      try {
        await video.play();
        iniciado = true;
        aviso.classList.add("oculto");
      } catch (erro) {
        aviso.textContent = "Toque novamente para assistir";
      }
    }

    iniciarVideo.addEventListener("click", reproduzirVideo);

    iniciarVideo.addEventListener("touchend", (evento) => {
      evento.preventDefault();
      reproduzirVideo();
    });

    video.addEventListener("ended", () => {
      window.location.href = "informacoes.html";
    });
  </script>
</body>
</html>
