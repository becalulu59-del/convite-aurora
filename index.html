<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Convite da Aurora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f8f2e8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /*
      Mantém a arte no formato vertical 9:16,
      sem esticar nem cortar a imagem.
    */
    .pagina {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      overflow: hidden;
      background: #f8f2e8;
    }

    .arte {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Botão invisível posicionado sobre o selo.
      A posição pode ser ajustada depois, caso necessário.
    */
    .abrir-carta {
      position: absolute;
      top: 38%;
      left: 61%;
      width: 30%;
      height: 22%;

      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .abrir-carta:focus-visible {
      outline: 3px solid rgba(188, 132, 87, 0.5);
      outline-offset: 3px;
    }

    /*
      Efeito discreto ao tocar no selo.
    */
    .pagina.saindo {
      animation: desaparecer 0.45s ease forwards;
    }

    @keyframes desaparecer {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(1.015);
      }
    }
  </style>
</head>

<body>
  <main class="pagina" id="paginaCarta">

    <img
      class="arte"
      src="assets/Para você… - 1.png"
      alt="Carta fechada do convite da Aurora"
    >

    <button
      class="abrir-carta"
      id="abrirCarta"
      type="button"
      aria-label="Abrir o convite"
    ></button>

  </main>

  <script>
    const paginaCarta = document.getElementById("paginaCarta");
    const abrirCarta = document.getElementById("abrirCarta");

    let abrindo = false;

    function irParaEraUmaVez() {
      if (abrindo) return;

      abrindo = true;
      paginaCarta.classList.add("saindo");

      window.setTimeout(() => {
        window.location.href = "erauma.html";
      }, 400);
    }

    abrirCarta.addEventListener("click", irParaEraUmaVez);

    abrirCarta.addEventListener("touchend", (evento) => {
      evento.preventDefault();
      irParaEraUmaVez();
    });
  </script>
</body>
</html>
