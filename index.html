<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f8f2e8" />
  <title>Convite da Aurora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" aria-label="Convite da Aurora">

    <section class="screen active" id="screen-carta" data-index="0" aria-label="Carta fechada">
      <img class="screen-media" src="assets/Para você… - 1.png" alt="Carta fechada do convite" />
      <button class="full-tap" id="open-letter" type="button" aria-label="Abrir a carta"></button>
    </section>

    <section class="screen" id="screen-erauma" data-index="1" aria-label="Era uma vez">
      <img class="screen-media" src="assets/Para você… - 2.png" alt="Era uma vez" />
      <button class="full-tap" id="open-video" type="button" aria-label="Continuar para o vídeo"></button>
    </section>

    <section class="screen" id="screen-video" data-index="2" aria-label="Vídeo">
      <video id="invite-video" class="screen-media" playsinline webkit-playsinline preload="auto">
        <source src="assets/Para você.mp4" type="video/mp4" />
      </video>
      <button id="play-video" class="video-start" type="button" aria-label="Tocar vídeo">
        <span>Toque para assistir</span>
      </button>
    </section>

    <section class="screen" id="screen-info" data-index="3" aria-label="Informações">
      <img class="screen-media" src="assets/Para você….png" alt="Informações da festa" />

      <a
        class="hotspot hotspot-map"
        href="https://maps.app.goo.gl/ZJfy86xhEm5KJTFS9?g_st=iw"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir endereço no Google Maps"
      ></a>

      <a
        class="hotspot hotspot-whatsapp"
        href="https://wa.me/5591982626609?text=Ol%C3%A1%21%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20na%20festa%20da%20Aurora."
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar presença pelo WhatsApp"
      ></a>

      <button
        class="hotspot hotspot-gifts"
        id="open-gifts"
        type="button"
        aria-label="Abrir sugestões de presentes"
      ></button>

      <button class="edge-next" id="go-crest" type="button" aria-label="Ir para o brasão"></button>
    </section>

    <section class="screen" id="screen-brasao" data-index="4" aria-label="Brasão final">
      <img class="screen-media" src="assets/Para você… - 5.png" alt="Brasão da Aurora" />
    </section>

    <section class="gifts-overlay" id="gifts-overlay" aria-hidden="true">
      <img
        class="screen-media"
        src="assets/Beige and Red Aesthetic A Love Letter.png"
        alt="Sugestões de presentes"
      />
      <button id="close-gifts" class="close-gifts" type="button" aria-label="Voltar para as informações">
        Voltar
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
